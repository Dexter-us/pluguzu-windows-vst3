name: Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [main, zen-master]
    paths:
      - ".github/workflows/windows-vst3.yml"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "web-ui/**"
      - "cabal.project"
      - "pluguzu.cabal"
      - "haskell-ffi/**"
      - "src/**"
      - "xtask/**"
      - "scripts/build-windows-vst3.ps1"
  pull_request:
    paths:
      - ".github/workflows/windows-vst3.yml"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "web-ui/**"
      - "cabal.project"
      - "pluguzu.cabal"
      - "haskell-ffi/**"
      - "src/**"
      - "xtask/**"
      - "scripts/build-windows-vst3.ps1"

permissions:
  contents: read

jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build CodeMirror editor
        working-directory: web-ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Upload editor page
        uses: actions/upload-artifact@v4
        with:
          name: zen-master-editor-page
          path: web-ui/dist/index.html
          if-no-files-found: error

  build:
    needs: editor
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download editor page
        uses: actions/download-artifact@v4
        with:
          name: zen-master-editor-page
          path: web-ui/dist

      - name: Install MinGW dependencies
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-libsamplerate

      - name: Install Haskell toolchain
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.3"
          cabal-version: "3.14.1.0"
          cabal-update: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Build VST3 bundle
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs['msys2-location'] }}
        run: .\scripts\build-windows-vst3.ps1

      - name: Upload VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: zen-master-windows-x64-vst3
          path: target/bundled/zen-master.vst3
          if-no-files-found: error
